name: lexroom_analytics
version: "1.0.0"
profile: lexroom

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  lexroom_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  timeout_latency_ms: 900000   # 15 min: the AMA backend hard timeout observed in the data
  min_rated_answers: 30        # below this, a weekly feedback rate is flagged as low sample
